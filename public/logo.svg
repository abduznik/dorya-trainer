<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dorya Trainer logo: Kazuya's red studded glove rising in the electric wind god fist,
       blocky style, lightning coiled around the forearm, DORYA! on top. -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- lightning behind the arm -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="square" filter="url(#glow)">
    <g stroke="#1f8fd6" stroke-width="16">
      <polyline points="120,300 170,282 150,318 214,306"/>
      <polyline points="392,286 346,304 372,334 318,346"/>
      <polyline points="118,420 168,404 150,444 208,436"/>
      <polyline points="398,404 350,420 378,452 330,466"/>
      <polyline points="150,150 200,160 176,194 230,186"/>
      <polyline points="372,146 330,160 356,192 300,196"/>
    </g>
    <g stroke="#ffffff" stroke-width="5">
      <polyline points="120,300 170,282 150,318 214,306"/>
      <polyline points="392,286 346,304 372,334 318,346"/>
      <polyline points="118,420 168,404 150,444 208,436"/>
      <polyline points="398,404 350,420 378,452 330,466"/>
      <polyline points="150,150 200,160 176,194 230,186"/>
      <polyline points="372,146 330,160 356,192 300,196"/>
    </g>
  </g>

  <!-- forearm: rises from the bottom with a lean into the punch -->
  <path d="M 214 540 Q 196 420 250 312" fill="none" stroke="#0b0b0d" stroke-width="112" stroke-linecap="butt"/>
  <path d="M 214 540 Q 196 420 250 312" fill="none" stroke="#e6e6ea" stroke-width="80" stroke-linecap="butt"/>
  <path d="M 214 540 Q 196 420 250 312" fill="none" stroke="#b9b9c0" stroke-width="18" stroke-linecap="butt" transform="translate(24 0)" opacity="0.7"/>

  <!-- glove cuff with strap and buckle -->
  <g transform="rotate(-10 256 300)">
    <rect x="176" y="268" width="160" height="70" fill="#0b0b0d"/>
    <rect x="186" y="278" width="140" height="50" fill="#d0202a"/>
    <rect x="186" y="292" width="140" height="18" fill="#6e1015"/>
    <rect x="286" y="288" width="30" height="26" fill="#0b0b0d"/>
    <rect x="292" y="294" width="18" height="14" fill="#c8c8cc"/>
  </g>

  <!-- the fist -->
  <g transform="rotate(-10 256 200)">
    <rect x="160" y="112" width="192" height="176" fill="#0b0b0d"/>
    <rect x="172" y="124" width="168" height="152" fill="#d0202a"/>
    <!-- finger creases -->
    <rect x="172" y="200" width="168" height="10" fill="#6e1015"/>
    <rect x="214" y="124" width="8" height="152" fill="#8f161c" opacity="0.7"/>
    <rect x="256" y="124" width="8" height="152" fill="#8f161c" opacity="0.7"/>
    <rect x="298" y="124" width="8" height="152" fill="#8f161c" opacity="0.7"/>
    <!-- studs, 3x3 on the knuckles -->
    <g fill="#0b0b0d">
      <rect x="190" y="138" width="26" height="26"/><rect x="242" y="138" width="26" height="26"/><rect x="294" y="138" width="26" height="26"/>
      <rect x="190" y="170" width="26" height="26"/><rect x="242" y="170" width="26" height="26"/><rect x="294" y="170" width="26" height="26"/>
    </g>
    <g fill="#cfd2d8">
      <rect x="196" y="144" width="14" height="14"/><rect x="248" y="144" width="14" height="14"/><rect x="300" y="144" width="14" height="14"/>
      <rect x="196" y="176" width="14" height="14"/><rect x="248" y="176" width="14" height="14"/><rect x="300" y="176" width="14" height="14"/>
    </g>
    <!-- thumb tucked on the left -->
    <rect x="150" y="196" width="60" height="70" fill="#0b0b0d"/>
    <rect x="160" y="206" width="40" height="50" fill="#d0202a"/>
    <rect x="160" y="228" width="40" height="8" fill="#6e1015"/>
  </g>

  <!-- lightning in front of the arm -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="square" filter="url(#glow)">
    <g stroke="#1f8fd6" stroke-width="16">
      <polyline points="150,352 212,340 190,374 262,362 244,398 312,386"/>
      <polyline points="132,470 190,458 174,492 240,478"/>
      <polyline points="372,352 322,362 344,392 292,404 312,436 262,446"/>
      <polyline points="384,470 336,486 356,514 308,526"/>
      <polyline points="102,236 146,244 130,270 176,272"/>
      <polyline points="410,230 366,246 386,270 338,276"/>
    </g>
    <g stroke="#ffffff" stroke-width="5">
      <polyline points="150,352 212,340 190,374 262,362 244,398 312,386"/>
      <polyline points="132,470 190,458 174,492 240,478"/>
      <polyline points="372,352 322,362 344,392 292,404 312,436 262,446"/>
      <polyline points="384,470 336,486 356,514 308,526"/>
      <polyline points="102,236 146,244 130,270 176,272"/>
      <polyline points="410,230 366,246 386,270 338,276"/>
    </g>
  </g>

  <!-- DORYA! -->
  <g transform="rotate(-4 256 70)">
    <text x="256" y="104" text-anchor="middle" font-family="Impact, 'Arial Black', 'Russo One', sans-serif" font-size="104" font-weight="900"
      fill="#ffffff" stroke="#0b0b0d" stroke-width="12" stroke-linejoin="miter" paint-order="stroke fill" letter-spacing="2">DORYA!</text>
  </g>
</svg>
