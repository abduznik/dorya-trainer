<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dorya Trainer logo: the in-game blocky arm rising in the electric wind god fist,
       lightning coiled around it. Same look as the 3D asset: light grey blocks, dark edges. -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- lightning behind the arm -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="square" filter="url(#glow)">
    <g stroke="#1f8fd6" stroke-width="16">
      <polyline points="112,290 168,272 148,308 214,296"/>
      <polyline points="400,276 350,294 376,324 320,336"/>
      <polyline points="110,414 166,398 148,438 208,430"/>
      <polyline points="404,398 352,414 380,446 330,460"/>
      <polyline points="140,112 196,124 172,158 232,150"/>
      <polyline points="384,110 336,124 362,156 302,160"/>
    </g>
    <g stroke="#ffffff" stroke-width="5">
      <polyline points="112,290 168,272 148,308 214,296"/>
      <polyline points="400,276 350,294 376,324 320,336"/>
      <polyline points="110,414 166,398 148,438 208,430"/>
      <polyline points="404,398 352,414 380,446 330,460"/>
      <polyline points="140,112 196,124 172,158 232,150"/>
      <polyline points="384,110 336,124 362,156 302,160"/>
    </g>
  </g>

  <!-- the arm, leaning into the punch: forearm block, wrist joint, fist block -->
  <g transform="rotate(-9 256 330)">
    <!-- forearm: box with the dark edge lines of the 3D asset -->
    <rect x="206" y="270" width="100" height="290" fill="#e6e6ea" stroke="#0b0b0d" stroke-width="7"/>
    <rect x="286" y="270" width="20" height="290" fill="#c4c4ca" stroke="#0b0b0d" stroke-width="7"/> <!-- side face -->
    <!-- wrist joint block (the dark joint ball of the rig) -->
    <rect x="212" y="240" width="88" height="40" fill="#1b1b1f" stroke="#0b0b0d" stroke-width="7"/>
    <!-- fist: the 0.2 m cube -->
    <rect x="176" y="96" width="160" height="150" fill="#e6e6ea" stroke="#0b0b0d" stroke-width="7"/>
    <rect x="304" y="96" width="32" height="150" fill="#c4c4ca" stroke="#0b0b0d" stroke-width="7"/> <!-- side face -->
    <rect x="176" y="96" width="160" height="30" fill="#f4f4f6" stroke="#0b0b0d" stroke-width="7"/> <!-- top face -->
    <!-- knuckle and finger lines -->
    <line x1="176" y1="176" x2="304" y2="176" stroke="#0b0b0d" stroke-width="5"/>
    <line x1="218" y1="126" x2="218" y2="176" stroke="#0b0b0d" stroke-width="5"/>
    <line x1="260" y1="126" x2="260" y2="176" stroke="#0b0b0d" stroke-width="5"/>
    <!-- thumb tucked on the left -->
    <rect x="164" y="176" width="46" height="60" fill="#e6e6ea" stroke="#0b0b0d" stroke-width="7"/>
  </g>

  <!-- lightning in front of the arm -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="square" filter="url(#glow)">
    <g stroke="#1f8fd6" stroke-width="16">
      <polyline points="146,346 208,334 186,368 258,356 240,392 308,380"/>
      <polyline points="128,466 186,454 170,488 236,474"/>
      <polyline points="378,344 328,354 350,384 298,396 318,428 268,438"/>
      <polyline points="388,466 340,482 360,510 312,522"/>
      <polyline points="96,220 140,228 124,254 170,256"/>
      <polyline points="416,214 372,230 392,254 344,260"/>
      <polyline points="196,60 232,74 214,96 250,100"/>
      <polyline points="322,54 288,70 306,94 272,100"/>
    </g>
    <g stroke="#ffffff" stroke-width="5">
      <polyline points="146,346 208,334 186,368 258,356 240,392 308,380"/>
      <polyline points="128,466 186,454 170,488 236,474"/>
      <polyline points="378,344 328,354 350,384 298,396 318,428 268,438"/>
      <polyline points="388,466 340,482 360,510 312,522"/>
      <polyline points="96,220 140,228 124,254 170,256"/>
      <polyline points="416,214 372,230 392,254 344,260"/>
      <polyline points="196,60 232,74 214,96 250,100"/>
      <polyline points="322,54 288,70 306,94 272,100"/>
    </g>
  </g>
</svg>
